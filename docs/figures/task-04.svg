<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280"><rect width="960" height="280" rx="18" fill="#12243a"/><text x="40" y="50" fill="#8bd3ff" font-size="16" font-family="Arial">BIT 2118 • TASK 04</text><text x="40" y="88" fill="#ffffff" font-size="27" font-family="Arial" font-weight="bold">Floating-Point Stability</text><text x="40" y="116" fill="#c3d0df" font-size="15" font-family="Arial">Finite precision can make algebraically equivalent expressions behave differently.</text><path d="M70 200 C130 198 170 185 220 150 S290 112 340 105" stroke="#8bd3ff" stroke-width="4" fill="none"/><path d="M70 200 C130 200 170 199 220 198 S290 197 340 196" stroke="#f7c873" stroke-width="4" fill="none"/><line x1="380" y1="70" x2="380" y2="225" stroke="#35516e" stroke-width="2"/><text x="420" y="100" fill="#fff" font-size="16" font-family="Arial">REPRESENTATION</text><path d="M550 95 H610" stroke="#7fe0b2" stroke-width="3"/><path d="M600 85 L610 95 L600 105" stroke="#7fe0b2" stroke-width="3" fill="none"/><text x="630" y="100" fill="#fff" font-size="16" font-family="Arial">ERROR ANALYSIS</text><text x="420" y="145" fill="#c3d0df" font-size="14" font-family="Arial">Absolute and relative error</text><text x="420" y="172" fill="#c3d0df" font-size="14" font-family="Arial">Cancellation and conditioning</text><text x="420" y="199" fill="#c3d0df" font-size="14" font-family="Arial">Use stable algebraic reformulations</text><text x="40" y="250" fill="#93a4ba" font-size="12" font-family="Arial">CONCEPTUAL ILLUSTRATION • NOT A MEASURED RESULT</text></svg>