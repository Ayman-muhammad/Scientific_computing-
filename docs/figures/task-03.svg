<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280"><rect width="960" height="280" rx="18" fill="#12243a"/><text x="40" y="50" fill="#8bd3ff" font-size="16" font-family="Arial">BIT 2118 • TASK 03</text><text x="40" y="88" fill="#ffffff" font-size="27" font-family="Arial" font-weight="bold">Vectorisation &amp; Benchmarking</text><text x="40" y="116" fill="#c3d0df" font-size="15" font-family="Arial">Compare equivalent loop and array computations; measure rather than assume speed-up.</text><path d="M70 200 L130 190 L190 165 L250 145 L310 110" stroke="#8bd3ff" stroke-width="5" fill="none"/><path d="M70 200 L130 198 L190 196 L250 194 L310 192" stroke="#f7c873" stroke-width="4" fill="none"/><line x1="380" y1="70" x2="380" y2="225" stroke="#35516e" stroke-width="2"/><text x="420" y="100" fill="#fff" font-size="16" font-family="Arial">INPUT ARRAY</text><path d="M530 95 H590" stroke="#7fe0b2" stroke-width="3"/><path d="M580 85 L590 95 L580 105" stroke="#7fe0b2" stroke-width="3" fill="none"/><text x="610" y="100" fill="#fff" font-size="16" font-family="Arial">VECTORISED OPERATION</text><text x="420" y="145" fill="#c3d0df" font-size="14" font-family="Arial">Same mathematical output</text><text x="420" y="172" fill="#c3d0df" font-size="14" font-family="Arial">Repeated timing measurements</text><text x="420" y="199" fill="#c3d0df" font-size="14" font-family="Arial">Speed-up = loop time / vector time</text><text x="40" y="250" fill="#93a4ba" font-size="12" font-family="Arial">CONCEPTUAL ILLUSTRATION • NOT A MEASURED RESULT</text></svg>